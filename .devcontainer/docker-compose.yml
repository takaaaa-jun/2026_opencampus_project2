services:
  frontend:
    image: node:22-bookworm-slim
    working_dir: /app/frontend
    volumes:
      - ..:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: sleep infinity
    stdin_open: true
    tty: true
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    working_dir: /app/backend
    volumes:
      - ..:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: "1"
      LOG_LEVEL: "INFO"
      PYTHONUNBUFFERED: "1"
      CORS_ALLOWED_ORIGINS: >-
        http://localhost:5173,http://127.0.0.1:5173
    command: |
      bash -lc '
        pip install --no-cache-dir -r requirements.txt &&
        if [ ! -f models/hand_landmarker.task ] ||
           [ ! -f models/pose_landmarker.task ]; then
          python scripts/download_models.py
        fi &&
        uvicorn app.main:app \
          --host 0.0.0.0 \
          --port 8000 \
          --reload
      '
    tty: true
    restart: unless-stopped